name: Generate Frontend Yarn Lockfile

on:
  push:
    branches:
      - integration/knowledge-creative-studio
    paths:
      - '.github/workflows/generate-frontend-lockfile.yml'
      - 'frontend/package.json'
      - 'frontend/yarn.lock'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  generate-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/knowledge-creative-studio

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ensure Yarn 1.22.22
        run: npm install --global yarn@1.22.22

      - name: Regenerate lockfile from package.json
        working-directory: frontend
        run: |
          rm -f yarn.lock
          yarn install --ignore-scripts --non-interactive
          test -s yarn.lock

      - name: Commit generated lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/yarn.lock
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git commit -m 'ci(frontend): regenerate yarn lockfile'
          git push origin HEAD:integration/knowledge-creative-studio
