name: Visual Ecosystem

on:
  pull_request:
    paths:
      - "atlas_core/visual.py"
      - "frontend/**"
      - "clients/atlas-godot/**"
      - "clients/atlas-desktop/**"
      - "clients/atlas-unreal/**"
      - "visual-systems/**"
      - "shared/protocols/**"
      - "knowledge-division/existing-resource-library-v1.json"
      - "tests/test_knowledge_bookshelf_contract.py"
      - "tests/test_teaching_contract.py"
      - "tests/test_visual_hub.py"
      - "tests/test_genesis_*.py"
      - ".github/workflows/visual-ecosystem.yml"
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: atlas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt pytest
      - name: Run Knowledge Bookshelf contract
        run: pytest -q tests/test_knowledge_bookshelf_contract.py tests/test_teaching_contract.py
      - name: Run available visual and GENESIS smoke tests
        shell: bash
        run: |
          shopt -s nullglob
          tests=(tests/test_visual_hub.py tests/test_genesis_*.py)
          available=()
          for test_path in "${tests[@]}"; do
            if [ -f "$test_path" ]; then
              available+=("$test_path")
            fi
          done
          if [ ${#available[@]} -eq 0 ]; then
            echo "Visual/GENESIS smoke tests are not present on this branch; skipping backend visual smoke tests."
            exit 0
          fi
          pytest -q "${available[@]}"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: CI=false yarn build

  tauri-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Tauri desktop client
        id: tauri
        shell: bash
        run: |
          if [ -f clients/atlas-desktop/src-tauri/Cargo.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ATLAS desktop Tauri client is not present on this branch; skipping cargo check."
          fi
      - name: Install Linux Tauri dependencies
        if: steps.tauri.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Prepare frontend distribution placeholder
        if: steps.tauri.outputs.present == 'true'
        run: |
          mkdir -p frontend/build
          printf '<!doctype html><html><body><div id="root"></div></body></html>' > frontend/build/index.html
      - uses: dtolnay/rust-toolchain@stable
        if: steps.tauri.outputs.present == 'true'
      - name: Run cargo check
        if: steps.tauri.outputs.present == 'true'
        working-directory: clients/atlas-desktop/src-tauri
        env:
          RUST_BACKTRACE: full
        run: cargo check --verbose
