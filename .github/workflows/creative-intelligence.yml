name: Creative Intelligence CI

on:
  push:
    paths:
      - 'creative_intelligence/**'
      - 'creative_production/**'
      - 'story_foundry/**'
      - 'academy/__init__.py'
      - 'academy/schemas.py'
      - 'academy/school_of_visual_development/**'
      - 'atlas_animation_studio/**'
      - 'tests/test_reference_media_provider.py'
      - 'tests/test_creative_reference_study_e2e.py'
      - 'tests/test_sqlite_creative_memory.py'
      - 'tests/test_creative_live_ingestion.py'
      - 'tests/test_creative_runtime.py'
      - 'tests/test_story_foundry_creative_bridge.py'
      - 'tests/test_mini_screenplay_creative_context.py'
      - 'tests/test_visual_animation_creative_context.py'
      - 'tests/test_creative_production_orchestrator.py'
      - 'tests/test_creative_design_sheets.py'
      - 'tests/test_creative_shot_planning.py'
      - 'tests/test_creative_production_manifest.py'
      - 'tests/test_creative_project_store.py'
      - 'tests/test_creative_versioned_orchestrator.py'
      - 'tests/test_creative_continuity.py'
      - 'tests/test_creative_continuity_readiness.py'
      - 'tests/test_creative_continuity_persistence.py'
      - 'tests/test_creative_production_final_e2e.py'
      - 'tests/test_story_quality_director.py'
      - 'tests/test_art_style_director.py'
      - 'tests/test_visual_quality_director.py'
      - 'tests/test_production_quality_gate.py'
      - 'tests/test_reference_provenance.py'
      - 'tests/test_creative_reference_library.py'
      - 'tests/test_craft_rubrics.py'
      - 'tests/test_creative_critic_council.py'
      - '.github/workflows/creative-intelligence.yml'
  pull_request:
    paths:
      - 'creative_intelligence/**'
      - 'creative_production/**'
      - 'story_foundry/**'
      - 'academy/__init__.py'
      - 'academy/schemas.py'
      - 'academy/school_of_visual_development/**'
      - 'atlas_animation_studio/**'
      - 'tests/test_reference_media_provider.py'
      - 'tests/test_creative_reference_study_e2e.py'
      - 'tests/test_sqlite_creative_memory.py'
      - 'tests/test_creative_live_ingestion.py'
      - 'tests/test_creative_runtime.py'
      - 'tests/test_story_foundry_creative_bridge.py'
      - 'tests/test_mini_screenplay_creative_context.py'
      - 'tests/test_visual_animation_creative_context.py'
      - 'tests/test_creative_production_orchestrator.py'
      - 'tests/test_creative_design_sheets.py'
      - 'tests/test_creative_shot_planning.py'
      - 'tests/test_creative_production_manifest.py'
      - 'tests/test_creative_project_store.py'
      - 'tests/test_creative_versioned_orchestrator.py'
      - 'tests/test_creative_continuity.py'
      - 'tests/test_creative_continuity_readiness.py'
      - 'tests/test_creative_continuity_persistence.py'
      - 'tests/test_creative_production_final_e2e.py'
      - 'tests/test_story_quality_director.py'
      - 'tests/test_art_style_director.py'
      - 'tests/test_visual_quality_director.py'
      - 'tests/test_production_quality_gate.py'
      - 'tests/test_reference_provenance.py'
      - 'tests/test_creative_reference_library.py'
      - 'tests/test_craft_rubrics.py'
      - 'tests/test_creative_critic_council.py'
      - '.github/workflows/creative-intelligence.yml'

jobs:
  creative-intelligence-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install test runner
        run: python -m pip install --upgrade pip pytest
      - name: Verify FFmpeg
        run: ffmpeg -version | head -n 1
      - name: Compile creative systems
        run: python -m compileall -q creative_intelligence creative_production story_foundry academy/school_of_visual_development atlas_animation_studio
      - name: Run creative intelligence tests
        run: >-
          python -m pytest -q
          tests/test_reference_media_provider.py
          tests/test_creative_reference_study_e2e.py
          tests/test_sqlite_creative_memory.py
          tests/test_creative_live_ingestion.py
          tests/test_creative_runtime.py
          tests/test_story_foundry_creative_bridge.py
          tests/test_mini_screenplay_creative_context.py
          tests/test_visual_animation_creative_context.py
          tests/test_creative_production_orchestrator.py
          tests/test_creative_design_sheets.py
          tests/test_creative_shot_planning.py
          tests/test_creative_production_manifest.py
          tests/test_creative_project_store.py
          tests/test_creative_versioned_orchestrator.py
          tests/test_creative_continuity.py
          tests/test_creative_continuity_readiness.py
          tests/test_creative_continuity_persistence.py
          tests/test_creative_production_final_e2e.py
          tests/test_story_quality_director.py
          tests/test_art_style_director.py
          tests/test_visual_quality_director.py
          tests/test_production_quality_gate.py
          tests/test_reference_provenance.py
          tests/test_creative_reference_library.py
          tests/test_craft_rubrics.py
          tests/test_creative_critic_council.py
