name: ATLAS Knowledge Bank Coverage Audit

on:
  push:
    branches:
      - main
      - feature/knowledge-connectors-v1
      - integration/knowledge-bookshelf-v1
    paths:
      - "knowledge_bank/world_sources/subjects/**"
      - ".github/workflows/knowledge-bank-coverage-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "knowledge_bank/world_sources/subjects/**"
      - ".github/workflows/knowledge-bank-coverage-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: knowledge-bank-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-audit:
    name: Knowledge Bank coverage and quality audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile auditors
        run: |
          python -m py_compile knowledge_bank/world_sources/subjects/coverage_audit.py
          python -m py_compile knowledge_bank/world_sources/subjects/quality_audit_v3.py

      - name: Run coverage audit
        run: python knowledge_bank/world_sources/subjects/coverage_audit.py

      - name: Run V3 quality audit
        run: python knowledge_bank/world_sources/subjects/quality_audit_v3.py

      - name: Validate reports
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          coverage_path = Path("knowledge_bank/world_sources/subjects/coverage_matrix_v2.json")
          quality_path = Path("knowledge_bank/world_sources/subjects/quality_matrix_v3.json")
          if not coverage_path.is_file():
              raise SystemExit("coverage_matrix_v2.json was not generated")
          if not quality_path.is_file():
              raise SystemExit("quality_matrix_v3.json was not generated")

          coverage = json.loads(coverage_path.read_text(encoding="utf-8"))
          quality = json.loads(quality_path.read_text(encoding="utf-8"))
          c = coverage.get("summary", {})
          q = quality.get("summary", {})

          if c.get("subject_count") != 30 or c.get("level_count") != 7 or c.get("total_cells") != 2716:
              raise SystemExit("Coverage taxonomy dimensions changed unexpectedly")
          if c["covered_cells"] + c["gap_cells"] != c["total_cells"]:
              raise SystemExit("Coverage cell accounting is inconsistent")

          required = {
              "resource_count", "source_quality_percent", "ingestion_percent",
              "retrieval_test_percent", "citation_ready_percent", "usable_knowledge_percent"
          }
          missing = sorted(required - q.keys())
          if missing:
              raise SystemExit(f"V3 quality summary missing fields: {missing}")
          for key in required - {"resource_count"}:
              if not 0 <= q[key] <= 100:
                  raise SystemExit(f"{key} outside 0-100")

          print("Coverage and V3 quality reports validated.")
          PY

      - name: Publish audit summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          coverage = json.loads(Path("knowledge_bank/world_sources/subjects/coverage_matrix_v2.json").read_text(encoding="utf-8"))
          quality = json.loads(Path("knowledge_bank/world_sources/subjects/quality_matrix_v3.json").read_text(encoding="utf-8"))
          c = coverage["summary"]
          q = quality["summary"]

          print("# ATLAS Knowledge Bank V3 Audit")
          print()
          print(f"- **Coverage:** {c['coverage_percent']}% ({c['covered_cells']}/{c['total_cells']})")
          print(f"- **Source quality:** {q['source_quality_percent']}%")
          print(f"- **Ingested:** {q['ingestion_percent']}%")
          print(f"- **Retrieval tested:** {q['retrieval_test_percent']}%")
          print(f"- **Citation ready:** {q['citation_ready_percent']}%")
          print(f"- **Usable knowledge:** {q['usable_knowledge_percent']}%")
          PY

      - name: Upload Knowledge Bank audit reports
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-bank-audit-v3
          path: |
            knowledge_bank/world_sources/subjects/coverage_matrix_v2.json
            knowledge_bank/world_sources/subjects/quality_matrix_v3.json
          if-no-files-found: error
          retention-days: 30
